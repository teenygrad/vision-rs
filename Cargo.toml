[workspace]
members = ["demos/parking_garage"]

# Single source of truth for teeny-* versions — members reference these via
# `{ workspace = true }` instead of repeating the version number.
[workspace.dependencies]
teeny-core     = { version = "0.2.0", features = ["std"] }
# default-features off: teeny-kernels defaults to `cuda`, which would otherwise pull the CUDA
# toolkit into a `riscv`-only build. The `cuda`/`riscv` features below turn the backend back on.
teeny-kernels  = { version = "0.2.0", default-features = false }
teeny-macros   = "0.2.0"
teeny-triton   = "0.2.0"
teeny-data     = "0.2.0"
teeny-cuda     = "0.2.0"
teeny-compiler = "0.2.0"
teeny-cli      = "0.2.0"
clap           = { version = "4", features = ["derive"] }

[package]
name = "vision-rs"
version = "0.1.4"
edition = "2024"
description = "A high-performance computer vision SDK for Rust."
license = "Apache-2.0"
repository = "https://github.com/teenygrad/vision-rs"
homepage = "https://github.com/teenygrad/vision-rs"
# The self-hosted reference, not docs.rs: it is built with --all-features, so it
# documents the cuda/training-gated items docs.rs's sandbox cannot build.
documentation = "https://docs.teenygrad.org/api/vision-rs/vision_rs/"
readme = "README.md"
keywords = ["computer-vision", "yolo", "detection", "segmentation", "tracking"]
categories = ["computer-vision", "multimedia"]

# docs.rs's sandboxed build has no CUDA toolkit, and the `cuda` feature (on
# by default) pulls in teeny-cuda, whose build.rs unconditionally runs
# bindgen against real CUDA headers. Unlike teeny-cuda itself, the cuda/
# training gating here is optional (see [features] below), so building
# without them (rather than skipping docs.rs entirely) still documents the
# vast majority of the public API. Items behind cuda/training are only
# visible in a local `cargo doc --all-features` build.
[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["cuda", "training"]
cuda = ["teeny-cuda", "teeny-compiler", "teeny-cli/cuda", "teeny-kernels/cuda", "teeny-test/cuda"]
# RISC-V RVV: ahead-of-time kernel compilation (`cargo teeny aot/package --device riscv`) and
# cross-building for riscv64gc. Inference/training still need `cuda` -- teenygrad has no RISC-V
# model runtime yet. Build with `--no-default-features --features riscv` to avoid CUDA entirely.
riscv = ["teeny-cli/riscv", "teeny-kernels/riscv"]
training = ["teeny-kernels/training", "teeny-core/training"]

[dependencies]
teeny-core     = { workspace = true }
teeny-kernels  = { workspace = true }
teeny-macros   = { workspace = true }
teeny-triton   = { workspace = true }
teeny-data     = { workspace = true }
teeny-cuda     = { workspace = true, optional = true }
teeny-compiler = { workspace = true, optional = true }
teeny-cli      = { workspace = true, optional = true }
anyhow         = { version = "1.0", default-features = false }

[dev-dependencies]
# CUDA test helpers (`teeny_test::cuda`, formerly `teeny_cuda::testing`). Path-only: teeny-test
# isn't published, and Cargo drops path dev-dependencies when publishing. Its `cuda` feature is
# enabled by this crate's `cuda` feature so `--no-default-features` tests need no CUDA toolkit.
teeny-test     = { path = "../teenygrad/testing/teeny-test" }
serial_test    = "3"
teeny-compiler = { workspace = true }
dotenv         = "0.15"
insta          = "1"
tokio          = { version = "1", features = ["full"] }
reqwest        = { version = "0.13", features = ["stream"] }
indicatif      = "0.18"
serde          = { version = "1", features = ["derive"] }
clap           = { workspace = true }
toml           = "0.8"
zip            = "2"
futures-util   = "0.3"
eframe         = { version = "0.29", features = ["x11"] }
image          = "0.25"
serde_json     = "1"

# [patch.crates-io] overrides all teenygrad crates with local path versions.
# Remove this section once the crates are published to crates.io.
#
# Only include crates that are ACTUALLY in the dependency tree. cross builds
# auto-mount path deps found by `cargo metadata`, but still validate ALL
# [patch] entries even unused ones — unmounted unused patches cause the cross
# build to fail. Keep this list in sync with the transitive dep graph.
#
# Enabled on this branch: the `riscv` feature needs teenygrad's RISC-V AOT
# backend (teeny-cli `riscv` feature, teeny-riscv), which isn't published to
# crates.io yet. [patch] is an unconditional override (not a fallback), so this
# requires a ../teenygrad checkout; comment it out again once teenygrad is
# published with RISC-V support.
[patch.crates-io]
teeny-core     = { path = "../teenygrad/core/teeny-core" }
teeny-kernels  = { path = "../teenygrad/kernels/teeny-kernels" }
teeny-triton   = { path = "../teenygrad/kernels/teeny-triton" }
teeny-compiler = { path = "../teenygrad/compiler/teeny-compiler" }
teeny-macros   = { path = "../teenygrad/macros/teeny-macros" }
teeny-cuda     = { path = "../teenygrad/drivers/teeny-cuda" }
teeny-riscv    = { path = "../teenygrad/drivers/teeny-riscv" }
teeny-runtime  = { path = "../teenygrad/runtime/teeny-runtime" }
teeny-data     = { path = "../teenygrad/utilities/teeny-data" }
teeny-cli      = { path = "../teenygrad/utilities/teeny-cli" }
