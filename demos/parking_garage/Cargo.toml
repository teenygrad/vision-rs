[package]
name = "parking-garage"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Build with `--features cuda` to enable YOLO inference.
# Requires TEENYC_PATH, TEENYC_CACHE_DIR, and MODELS_CACHE_DIR env vars.
cuda = [
    "dep:vision-rs",
    "vision-rs/cuda",
    "dep:teeny-core",
    "dep:teeny-cuda",
    "dep:teeny-test",
    "teeny-test/cuda",
    "dep:teeny-compiler",
    "dep:teeny-cli",
    "teeny-cli/cuda",
    "dep:teeny-kernels",
    "dep:teeny-data",
    "dep:image",
    "dep:reqwest",
    "dep:clap",
]
# Build with `--features riscv` (and no `cuda`) for RISC-V RVV: AOT-compiles the server's kernels
# (`cargo teeny package --target spacemit-k3 ...`) and runs inference through teeny-test's
# `RuntimeModel`, launching kernels natively on a riscv64 board.
riscv = [
    "dep:vision-rs",
    "vision-rs/riscv",
    "dep:teeny-core",
    "dep:teeny-riscv",
    "dep:teeny-test",
    "teeny-test/riscv",
    "dep:teeny-cli",
    "teeny-cli/riscv",
    "dep:teeny-kernels",
    "dep:teeny-data",
    "dep:image",
    "dep:reqwest",
    "dep:clap",
]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = "0.4"
dotenv = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Optional inference/AOT deps (enabled by --features cuda or --features riscv)
vision-rs      = { path = "../..", optional = true, default-features = false }
teeny-core     = { workspace = true, optional = true }
teeny-cuda     = { workspace = true, optional = true }
# RISC-V chip identifiers (`Capability`), to pick the packaged kernels' target. Resolved to
# ../teenygrad by the workspace's [patch.crates-io].
teeny-riscv    = { version = "0.2", optional = true }
# CUDA device setup helpers (`teeny_test::cuda`, formerly `teeny_cuda::testing`). Path-only:
# teeny-test isn't published (fine here -- this demo is `publish = false`).
teeny-test     = { path = "../../../teenygrad/testing/teeny-test", optional = true }
teeny-compiler = { workspace = true, optional = true }
teeny-cli      = { workspace = true, optional = true }
teeny-kernels  = { workspace = true, optional = true }
teeny-data     = { workspace = true, optional = true }
image          = { version = "0.25", optional = true }
reqwest        = { version = "0.13", optional = true, features = ["stream"] }
clap           = { workspace = true, optional = true }

[[bin]]
name = "parking-garage-server"
path = "src/bin/server.rs"

[[bin]]
name = "parking-garage-webapp"
path = "src/bin/webapp.rs"
